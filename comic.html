<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Embezzler - Comic</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Georgia,serif;
    background:#0b0f19;
    color:#e5e7eb;
    line-height:1.6;
}

#progress-container{
    position:fixed;
    top:0;
    width:100%;
    height:5px;
    background:#1f2937;
    z-index:999;
}

#progress-bar{
    height:5px;
    width:0%;
    background:#2563eb;
}

header{
    background:#111827;
    color:white;
    text-align:center;
    padding:25px 20px 20px;
}

header h1{
    margin:0 0 6px;
}

header p{
    margin:0;
    color:#9ca3af;
}

.toolbar{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    margin-top:16px;
}

select{
    font-family:inherit;
    font-size:1em;
    padding:10px 12px;
    border-radius:6px;
    border:1px solid #374151;
    background:#1f2937;
    color:#e5e7eb;
    max-width:100%;
}

.btn{
    text-decoration:none;
    padding:12px 18px;
    border-radius:6px;
    background:#2563eb;
    color:white;
    display:inline-block;
}

.btn.secondary{
    background:#374151;
}

.reader{
    max-width:820px;
    margin:0 auto;
    padding:20px 10px;
}

.reader img{
    display:block;
    width:100%;
    height:auto;
    margin:0 0 6px;
    background:#111827;
    border-radius:2px;
}

.navigation{
    max-width:820px;
    margin:10px auto 0;
    padding:0 20px;
    display:flex;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
}

.social{
    text-align:center;
    margin:30px 20px 0;
}

.social a{
    color:#93c5fd;
}

footer{
    text-align:center;
    padding:30px;
    color:#9ca3af;
}

</style>

</head>

<body>

<div id="progress-container">
<div id="progress-bar"></div>
</div>

<header>
<h1>The Embezzler</h1>
<p>The Comic</p>

<div class="toolbar">
<select id="chapterSelect" aria-label="Choose chapter"></select>
<a id="textLink" class="btn secondary" href="chapter.html">Read this chapter</a>
</div>
</header>

<main id="reader" class="reader">
<p style="text-align:center">Loading comic...</p>
</main>

<div class="navigation">
<a id="prevBtn" class="btn" href="#">← Previous</a>
<a class="btn secondary" href="index.html">Home</a>
<a id="nextBtn" class="btn" href="#">Next →</a>
</div>

<p class="social">
Follow the comic on Instagram:
<a href="https://www.instagram.com/thespearweilder/" target="_blank" rel="noopener">@thespearweilder</a>
</p>

<footer>
© 2026 Kesava Nittala
</footer>

<script>

const params = new URLSearchParams(window.location.search);

const reader = document.getElementById("reader");
const select = document.getElementById("chapterSelect");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");

function pageUrl(id){
    return `comic.html?c=${encodeURIComponent(id)}`;
}

fetch("comic/comic.json")
.then(response => {

    if(!response.ok){
        throw new Error("Comic list not found");
    }

    return response.json();

})
.then(data => {

    const sections = data.chapters;
    const size = data.pageSize;

    const wanted = params.get("c") || sections[0].id;
    let index = sections.findIndex(s => s.id === wanted);
    if(index < 0){ index = 0; }

    const current = sections[index];

    document.title = `The Embezzler - Comic - ${current.title}`;

    sections.forEach((s, i) => {
        const opt = document.createElement("option");
        opt.value = s.id;
        opt.textContent = s.title;
        opt.selected = (i === index);
        select.appendChild(opt);
    });

    select.addEventListener("change", () => {
        window.location.href = pageUrl(select.value);
    });

    document.getElementById("textLink").href =
        `chapter.html?file=${encodeURIComponent(current.file)}`;

    if(index > 0){
        prevBtn.href = pageUrl(sections[index-1].id);
    }else{
        prevBtn.style.visibility = "hidden";
    }

    if(index < sections.length-1){
        nextBtn.href = pageUrl(sections[index+1].id);
    }else{
        nextBtn.style.visibility = "hidden";
    }

    reader.innerHTML = "";

    current.pages.forEach((p, i) => {
        const img = document.createElement("img");
        // Two sizes per page: phones fetch the 640px file, wider or sharper screens the full one.
        // The reader is at most 800px wide, and 100vw minus its 20px padding on smaller screens.
        img.src = `comic/${p}`;
        img.srcset = `comic/${p.replace(".webp", "-640.webp")} 640w, comic/${p} ${size[0]}w`;
        img.sizes = "(min-width: 820px) 800px, calc(100vw - 20px)";
        img.decoding = "async";
        img.width = size[0];
        img.height = size[1];
        img.alt = `${current.title}, page ${i+1}`;
        // The first two pages load at once; the rest load as the reader scrolls.
        if(i > 1){ img.loading = "lazy"; }
        reader.appendChild(img);
    });

    document.addEventListener("keydown", e => {
        if(e.target.tagName === "SELECT" || e.altKey || e.ctrlKey || e.metaKey){ return; }
        if(e.key === "ArrowLeft" && index > 0){
            window.location.href = pageUrl(sections[index-1].id);
        }
        if(e.key === "ArrowRight" && index < sections.length-1){
            window.location.href = pageUrl(sections[index+1].id);
        }
    });

})
.catch(() => {

    reader.innerHTML = "<h2>Comic Not Found</h2>";

});

window.addEventListener("scroll", () => {

    const winScroll =
    document.documentElement.scrollTop;

    const height =
    document.documentElement.scrollHeight -
    document.documentElement.clientHeight;

    const scrolled =
    height > 0 ? (winScroll/height)*100 : 0;

    document.getElementById("progress-bar").style.width =
    scrolled + "%";

});

</script>

<script src="feedback.js" data-story="The Embezzler"></script>

</body>
</html>
